# GitHub Actions セルフホステッドランナー
#
# 使い方:
#   1. .env.example をコピーして .env を作成
#   2. .env に GitHub PAT を設定
#   3. docker compose up -d で起動
#   4. docker compose down で停止（ランナー自動登録解除）
#
# ランナー状態確認:
#   docker compose ps
#   docker compose logs -f <サービス名>
#
# キャッシュ管理:
#   docker volume ls | grep github-runners  # キャッシュボリューム一覧
#   docker compose down -v                  # 停止+キャッシュ全削除
#
# Docker Desktop アップデート後の復旧:
#   docker compose up -d  # REPLACE_EXISTING_RUNNER により自動復旧

x-runner-base: &runner-base
  # latest は Ubuntu 20.04 ベース（glibc 2.31）で、@cloudflare/workerd-linux-64 が
  # 要求する GLIBC_2.32〜2.35 を満たさない。CatPro-Cloudflare の
  # vitest-pool-workers が workerd を起動できず、テストが1件も走らないまま
  # 失敗していた。glibc 2.39 の Ubuntu 24.04 ベースを明示指定する。
  image: myoung34/github-runner:ubuntu-noble
  restart: unless-stopped
  stop_grace_period: 30s

# CI 用。ci ラベルを付けるのは Dependabot 専用ランナーと区別するため。
# ランナー登録時に self-hosted / Linux / X64 は GitHub が自動で付与するので、
# Dependabot 専用ランナーからこれらを外すことはできない。そのため
# runs-on: self-hosted と書くと Dependabot 用ランナーも候補に入ってしまう。
# 区別するには CI 側が持つラベルを足し、runs-on: [self-hosted, ci] と書く。
x-runner-env: &runner-env
  ACCESS_TOKEN: ${GITHUB_PAT}
  RUNNER_WORKDIR: /tmp/runner/work
  LABELS: self-hosted,linux,x64,ci
  DISABLE_AUTO_UPDATE: "1"
  REPLACE_EXISTING_RUNNER: "true"
  EPHEMERAL: "true"

# Dependabot on self-hosted runners を有効にしたリポジトリ用。
# Dependabot のジョブは runs-on を指定できず、"dependabot" ラベルを持つ
# ランナーだけを探す。このラベルが無いとジョブはキューに滞留したまま
# 24時間後にキャンセルされ、依存更新が一切行われない。
x-runner-env-dependabot: &runner-env-dependabot
  ACCESS_TOKEN: ${GITHUB_PAT}
  RUNNER_WORKDIR: /tmp/runner/work
  LABELS: self-hosted,linux,x64,dependabot
  DISABLE_AUTO_UPDATE: "1"
  REPLACE_EXISTING_RUNNER: "true"
  EPHEMERAL: "true"

services:
  # === vehicle-management (3台: CI + deploy系が多い, npm) ===
  runner-vehicle-management-1:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vehicle-toolcache:/opt/hostedtoolcache
      - vehicle-npm-cache:/root/.npm
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/vehicle-management
      RUNNER_NAME: local-vehicle-management-1

  runner-vehicle-management-2:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vehicle-toolcache:/opt/hostedtoolcache
      - vehicle-npm-cache:/root/.npm
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/vehicle-management
      RUNNER_NAME: local-vehicle-management-2

  runner-vehicle-management-3:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vehicle-toolcache:/opt/hostedtoolcache
      - vehicle-npm-cache:/root/.npm
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/vehicle-management
      RUNNER_NAME: local-vehicle-management-3

  # === CatPro-Cloudflare (2台: CI + E2E, pnpm) ===
  runner-catpro-cloudflare-1:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - catpro-toolcache:/opt/hostedtoolcache
      - catpro-pnpm-store:/root/.local/share/pnpm/store
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/CatPro-Cloudflare
      RUNNER_NAME: local-catpro-cloudflare-1

  runner-catpro-cloudflare-2:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - catpro-toolcache:/opt/hostedtoolcache
      - catpro-pnpm-store:/root/.local/share/pnpm/store
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/CatPro-Cloudflare
      RUNNER_NAME: local-catpro-cloudflare-2

  # === devcontainer-base (1台: 手動実行のみ) ===
  runner-devcontainer-base:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - devcontainer-toolcache:/opt/hostedtoolcache
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/devcontainer-base
      RUNNER_NAME: local-devcontainer-base

  # === 223n-tech organization ===
  # === haru.223n.tech (2台: deploy + scheduled-build, pnpm) ===
  runner-haru-223n-tech-1:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - haru-toolcache:/opt/hostedtoolcache
      - haru-pnpm-store:/root/.local/share/pnpm/store
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n-tech/haru.223n.tech
      RUNNER_NAME: local-haru-223n-tech-1

  runner-haru-223n-tech-2:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - haru-toolcache:/opt/hostedtoolcache
      - haru-pnpm-store:/root/.local/share/pnpm/store
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n-tech/haru.223n.tech
      RUNNER_NAME: local-haru-223n-tech-2

  # === FursuitWeather_iMac (2台: CI + deploy, npm) ===
  runner-fursuit-weather-macos-1:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fursuitweather-imac-toolcache:/opt/hostedtoolcache
      - fursuit-weather-macos-npm-cache:/root/.npm
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/FursuitWeather_iMac
      RUNNER_NAME: local-fursuit-weather-imac-1

  runner-fursuit-weather-macos-2:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fursuitweather-imac-toolcache:/opt/hostedtoolcache
      - fursuit-weather-macos-npm-cache:/root/.npm
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/FursuitWeather_iMac
      RUNNER_NAME: local-fursuit-weather-imac-2

  # === Dependabot 専用ランナー ===
  # 下記リポジトリは "Dependabot on self-hosted runners" が有効になっている。
  # CI 用ランナーとは別に立てることで、CI の空き待ちで依存更新が滞らないようにする。
  runner-catpro-cloudflare-dependabot:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - catpro-toolcache:/opt/hostedtoolcache
      - catpro-pnpm-store:/root/.local/share/pnpm/store
    environment:
      <<: *runner-env-dependabot
      REPO_URL: https://github.com/223n/CatPro-Cloudflare
      RUNNER_NAME: local-catpro-cloudflare-dependabot

  runner-vehicle-management-dependabot:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - vehicle-toolcache:/opt/hostedtoolcache
      - vehicle-npm-cache:/root/.npm
    environment:
      <<: *runner-env-dependabot
      REPO_URL: https://github.com/223n/vehicle-management
      RUNNER_NAME: local-vehicle-management-dependabot

  runner-npo-tool-dependabot:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - npo-tool-toolcache:/opt/hostedtoolcache
      - npo-tool-composer-cache:/root/.composer/cache
    environment:
      <<: *runner-env-dependabot
      REPO_URL: https://github.com/223n/npo-tool
      RUNNER_NAME: local-npo-tool-dependabot

  runner-sleep-diary-php-dependabot:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sleep-diary-toolcache:/opt/hostedtoolcache
      - sleep-diary-composer-cache:/root/.composer/cache
    environment:
      <<: *runner-env-dependabot
      REPO_URL: https://github.com/223n/sleep-diary-php
      RUNNER_NAME: local-sleep-diary-php-dependabot

  runner-fursuit-weather-ios-dependabot:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fursuitweather-ios-toolcache:/opt/hostedtoolcache
      - fursuit-weather-ios-npm-cache:/root/.npm
    environment:
      <<: *runner-env-dependabot
      REPO_URL: https://github.com/223n/FursuitWeather_iOS
      RUNNER_NAME: local-fursuit-weather-ios-dependabot

  # === CI用の共有 MySQL ===
  # GitHub Actions の services: は、docker.sock をマウントしたコンテナー内
  # ランナーでは使えない。サービスコンテナーのポートは Docker ホスト側に
  # 公開される一方、ジョブから見た 127.0.0.1 はランナーコンテナー内を指すため、
  # 両者がつながらない。
  # そこで常設の MySQL を同じ compose ネットワークに置き、ワークフローからは
  # ホスト名 mysql で参照する（compose の既定ネットワークで名前解決できる）。
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # === npo-tool (1台: CI。PHP + MySQL) ===
  # 1台に絞ってジョブを直列化する。共有 MySQL を使うため、同一リポジトリの
  # ジョブが並走するとデータベースを取り合う。
  runner-npo-tool:
    <<: *runner-base
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - npo-tool-ci-toolcache:/opt/hostedtoolcache
      - npo-tool-composer-cache:/root/.composer/cache
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/npo-tool
      RUNNER_NAME: local-npo-tool-ci

  # === sleep-diary-php (1台: CI。PHP + MySQL) ===
  runner-sleep-diary-php:
    <<: *runner-base
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sleep-diary-ci-toolcache:/opt/hostedtoolcache
      - sleep-diary-ci-composer-cache:/root/.composer/cache
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/sleep-diary-php
      RUNNER_NAME: local-sleep-diary-php-ci

volumes:
  # vehicle-management
  vehicle-toolcache:
  vehicle-npm-cache:
  # CatPro-Cloudflare
  catpro-toolcache:
  catpro-pnpm-store:
  # devcontainer-base
  devcontainer-toolcache:
  # haru.223n.tech
  haru-toolcache:
  haru-pnpm-store:
  # FursuitWeather_iMac
  fursuitweather-imac-toolcache:
  fursuit-weather-macos-npm-cache:
  # npo-tool (Dependabot 専用)
  npo-tool-toolcache:
  npo-tool-composer-cache:
  # sleep-diary-php (Dependabot 専用)
  sleep-diary-toolcache:
  sleep-diary-composer-cache:
  # FursuitWeather_iOS (Dependabot 専用)
  fursuitweather-ios-toolcache:
  fursuit-weather-ios-npm-cache:
  # CI用の共有 MySQL
  mysql-data:
  # npo-tool (CI)
  npo-tool-ci-toolcache:
  # sleep-diary-php (CI)
  sleep-diary-ci-toolcache:
  sleep-diary-ci-composer-cache:
