# GitHub Actions セルフホステッドランナー
#
# 使い方:
#   1. .env.example をコピーして .env を作成
#   2. .env に GitHub PAT を設定
#   3. docker compose up -d で起動
#   4. docker compose down で停止（ランナー自動登録解除）
#
# ランナー状態確認:
#   docker compose ps
#   docker compose logs -f <サービス名>
#
# キャッシュ管理:
#   docker volume ls | grep github-runners  # キャッシュボリューム一覧
#   docker compose down -v                  # 停止+キャッシュ全削除
#
# Docker Desktop アップデート後の復旧:
#   docker compose up -d  # REPLACE_EXISTING_RUNNER により自動復旧

x-runner-base: &runner-base
  image: myoung34/github-runner:latest
  restart: unless-stopped
  stop_grace_period: 30s

x-runner-env: &runner-env
  ACCESS_TOKEN: ${GITHUB_PAT}
  RUNNER_WORKDIR: /tmp/runner/work
  LABELS: self-hosted,linux,x64
  DISABLE_AUTO_UPDATE: "1"
  REPLACE_EXISTING_RUNNER: "true"
  EPHEMERAL: "true"

services:
  # === kigurumi-event-hub (3台: CI + deploy系が多い, pnpm) ===
  runner-kigurumi-event-hub-1:
    <<: *runner-base
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - kigurumi-toolcache:/opt/hostedtoolcache
      - kigurumi-pnpm-store:/root/.local/share/pnpm/store
    environment:
      <<: *runner-env
      REPO_URL: https://github.com/223n/kigurumi-event-hub
      RUNNER_NAME: local-kigurumi-event-hub-1

  runner-kigurumi-event-hub-2:
